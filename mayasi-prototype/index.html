<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1210" />
    <title>Mayasi — Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="stage" aria-label="Scène 3D Mayasi"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="top">
        <div class="brand">
          <span class="brand-mark">M</span>
          <div class="brand-text">
            <p class="brand-name">Mayasi</p>
            <p class="brand-sub">Prototype interactif · Meshy</p>
          </div>
        </div>
        <p id="status" class="status" role="status">Chargement…</p>
      </header>

      <aside id="banner" class="banner hidden" role="alert"></aside>

      <main class="hud">
        <section class="panel">
          <p class="eyebrow">Animations</p>
          <h1 class="headline">Fais bouger Mayasi</h1>
          <p class="lede">
            Clique une animation. Orbite avec la souris ou le doigt —
            molette pour zoomer.
          </p>
          <div id="groups" class="groups" aria-label="Groupes d'animations"></div>
          <div class="meta">
            <div>
              <span class="meta-label">Clip</span>
              <strong id="clip-name">—</strong>
            </div>
            <div>
              <span class="meta-label">Groupe</span>
              <strong id="group-name">—</strong>
            </div>
          </div>
        </section>
      </main>

      <footer class="foot">
        <span>Orbit · zoom · Meshy Urban Ease</span>
        <span id="fps">— fps</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
